<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoSphere</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        /* Button container */
        
        .buttons {
            position: fixed;
            right: 10px;
            top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        /* Styling for buttons */
        
        .buttons button {
            background-color: #111;
            color: white;
            border: none;
            cursor: pointer;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        
        .buttons button:hover {
            background-color: #333;
        }
        /* Floating Panel (initially hidden) */
        
        .floating-panel {
            position: fixed;
            top: 0;
            left: -400px;
            /* Initially hidden off-screen to the left */
            width: 400px;
            height: 100%;
            /* Full height */
            padding: 40px;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.6);
            /* Rounded corners on the right side */
            transition: left 0.5s ease;
            /* Smooth transition */
        }
        
        .floating-panel.active {
            left: 0;
            /* Move into view */
        }
        
        .floating-panel h2 {
            margin: 0 0 30px;
            padding: 0;
            color: #fff;
            text-align: center;
        }
        
        .floating-panel .description {
            color: #fff;
            margin-bottom: 30px;
            text-align: justify;
            font-size: 19px;
            /* Justify text */
        }
        /* Close button hidden initially */
        
        .close-button {
            display: none;
            /* Initially hidden */
            margin-top: 20px;
            padding: 10px 15px;
            background-color: #ff4d4d;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        
        .floating-panel.active .close-button {
            display: block;
            /* Show when panel is active */
        }
    </style>
    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js", "jsm/": "https://cdn.jsdelivr.net/npm/three@0.161/examples/jsm/" } }
    </script>
</head>

<body>
    <div class="buttons">
        <button id="co2EmissionsBtn" onclick="playAudio('audio/audio1.mp3'); showPanel('CO2 Emissions', 'If CO₂ concentrations continue to rise unchecked, Earth\'s atmosphere will trap increasing amounts of heat. This would lead to more frequent and intense heatwaves, droughts, and extreme weather events. Coastal regions would suffer as sea levels rise, and ecosystems such as coral reefs would collapse due to acidification and warming waters. The concentration of atmospheric CO₂ is already at alarming levels, and without action, the planet\'s temperature could rise by 3-4°C by the end of the century, making many regions uninhabitable (Earth Information Center).', '../textures/carbon.jpg')">CO2 Emissions</button>
        <button id="methaneBtn" onclick="playAudio('Topic1/Topic-1-speach.wav'); showPanel('Global Methane Emissions from Wetlands', 'Methane (CH₄) is a potent greenhouse gas, and wetlands are one of its major natural sources. If methane emissions from these regions are left unmanaged, they will greatly amplify global warming. Methane traps heat more effectively than CO₂ in the short term, and an unchecked rise in methane levels would accelerate climate impacts like melting permafrost and arctic sea ice. Ignoring methane could lead to runaway feedback loops where warming triggers even more emissions from natural sources like wetlands.', '../textures/Witlands.png')">Methane</button>
        <button id="co2FluxBtn" onclick="playAudio('audio/audio3.mp3'); showPanel('Global Ocean Carbon Absorption', 'Oceans act as a massive carbon sink, absorbing roughly 25% of human-made CO₂ emissions. However, rising temperatures reduce the ocean\'s ability to absorb CO₂, and unchecked emissions will exacerbate this effect. This would result in more CO₂ staying in the atmosphere, further accelerating global warming. Additionally, ocean acidification would continue to worsen, damaging marine ecosystems like coral reefs and shellfish populations, which are crucial for biodiversity and human livelihoods.', '../textures/flux.png')">CO2 Flux</button>
    </div>

    <!-- Floating Panel -->
    <div id="floating-panel" class="floating-panel">
        <h2 id="panel-title">Panel Title</h2>
        
        <!-- Add the image here -->
        <img id="panel-image" src="" alt="Panel Image" style="width: 100%; height: auto; margin-bottom: 20px; display: none;" />
        
        <p id="panel-description" class="description">This is a floating panel content.</p>
        <button class="close-button" onclick="hidePanel()">Close</button>
    </div>

    <!-- Audio elements for each button -->
    <audio id="audioPlayer" src=""></audio>

    <script>
        const audioPlayer = document.getElementById("audioPlayer");

        audioPlayer.addEventListener('play', () => {
            console.log('Audio is playing');
        });

        audioPlayer.addEventListener('error', (e) => {
            console.error('Error occurred:', e);
        });

        function playAudio(audioFile) {
            console.log(`Playing audio from: ${audioFile}`); // Log the audio file path
            audioPlayer.src = audioFile; // Set the audio file
            audioPlayer.play() // Play the audio
                .catch(error => console.error('Playback error:', error)); // Handle any playback errors
        }

        function showPanel(panelTitle, panelDescription, imageUrl) {
            document.getElementById("panel-title").innerText = panelTitle;
            document.getElementById("panel-description").innerText = panelDescription;
            
            const panelImage = document.getElementById("panel-image");
            panelImage.src = imageUrl; // Set the image source
            panelImage.style.display = imageUrl ? "block" : "none"; // Show the image if a URL is provided
            
            const panel = document.getElementById("floating-panel");
            panel.classList.add("active"); // Add class to show the panel
        }

        function hidePanel() {
            const panel = document.getElementById("floating-panel");
            panel.classList.remove("active"); // Remove class to hide the panel
        }
    </script>

    <script type="module" src="index.js"></script>
</body>

</html>
